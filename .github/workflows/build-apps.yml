name: Build NovaFlix Apps (APK & EXE)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle-build.log

      - name: Upload Gradle Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gradle-Build-Log
          path: gradle-build.log
          if-no-files-found: ignore

      - name: Print Gradle Diagnostic
        if: always()
        run: |
          if [ -f gradle-build.log ]; then
            echo "=== FULL GRADLE BUILD LOG (TAIL) ==="
            tail -n 80 gradle-build.log
            ERR=$(grep -i -E "FAILURE:|What went wrong:|Execution failed|requires|caused by" gradle-build.log -A 4 | head -n 20 | tr '\n' ' ' | tr '\r' ' ')
            echo "::warning title=GradleDiagnostic::$ERR"
          fi

      - name: Copy & Rename APK
        run: |
          mkdir -p build-artifacts
          APK_PATH=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" build-artifacts/NovaFlix-Android.apk
            echo "Copied $APK_PATH to build-artifacts/NovaFlix-Android.apk"
            ls -lh build-artifacts/
          else
            echo "::error::No APK file found in android/app/build/outputs/apk"
            exit 1
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaFlix-Android-APK
          path: build-artifacts/NovaFlix-Android.apk

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Windows Executable
        run: npm run build:win

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaFlix-Windows-EXE
          path: dist-electron/*.exe

  release:
    name: Publish Release with APK & EXE
    needs: [build-android, build-windows]
    if: always() && !cancelled() && (needs.build-android.result == 'success' || needs.build-windows.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: NovaFlix-Android-APK
          path: release-assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: NovaFlix-Windows-EXE
          path: release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.0.5' }}
          name: NovaFlix Apps ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.0.5' }}
          make_latest: true
          generate_release_notes: true
          body: |
            ## 🚀 NovaFlix Streaming v2.0.5 — Aplicativos Oficiais & Deploy Automático VPS
            
            - **📱 Android APK (`NovaFlix-Android.apk`):** Celular Android e TV Box
            - **💻 Windows EXE (`NovaFlix.exe`):** Executável portátil para Windows 10/11
            - **🎬 Catálogo VOD v2.0.5:** 15.969 Filmes + 6.876 Séries (incluindo 2.238 Filmes Adultos +18 e 189 Séries Adultas +18 no Painel e no Controle Remoto ADM)
            
            ### ⚡ Instalação Automática na VPS (1 Comando):
            ```bash
            curl -fsSL https://raw.githubusercontent.com/zetra-mini/novaflix/main/deploy-vps.sh | sudo bash
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
